[package]
name = "gui-timelapse-maker"
version = "0.1.0"
description = "Stitch a folder of timelapse frames into an MP4"
authors = ["Coulter Peterson"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gui_timelapse_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
